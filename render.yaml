# Blueprint do Render: cria o banco PostgreSQL e o serviço web (API + frontend) a partir do GitHub.
# Render → New → Blueprint → selecione este repositório.
databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus

services:
  - type: web
    name: nexus-manager
    runtime: node
    plan: free
    buildCommand: npm run build # instala devDependencies mesmo com NODE_ENV=production
    startCommand: npm run start:demo
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # APP_URL é opcional no Render: sem ela, usa a URL pública do serviço (RENDER_EXTERNAL_URL).
      # Defina só se usar domínio próprio.
      - key: DEMO_MODE
        value: "true" # mostra o link de recuperação na tela; remova quando configurar SMTP
