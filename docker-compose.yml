# Sobe tudo localmente: docker compose up --build  →  http://localhost:3333
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["3333:3333"]
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus
      JWT_SECRET: troque-este-segredo-por-um-valor-aleatorio-longo
      APP_URL: http://localhost:3333
      DEMO_MODE: "true"
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
